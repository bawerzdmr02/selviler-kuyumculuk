# Selviler Kuyumculuk — Nginx reverse proxy taslağı
#
# Kurulum (Ubuntu VPS):
#   sudo cp selvilerkuyumculuk.com.conf /etc/nginx/sites-available/selviler
#   sudo ln -s /etc/nginx/sites-available/selviler /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (adım 11 — Certbot HTTP bloğunu HTTPS'e dönüştürür):
#   sudo certbot --nginx -d selvilerkuyumculuk.com -d www.selvilerkuyumculuk.com
#
# Upstream: PM2 cluster → localhost:3000 (ecosystem.config.js)

upstream selviler_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP — Certbot sonrası genellikle 443 server bloğu eklenir ve
# buraya return 301 https://$host$request_uri; yazılır.
server {
    listen 80;
    listen [::]:80;
    server_name selvilerkuyumculuk.com www.selvilerkuyumculuk.com;

    # İleride ürün görseli yüklemeleri (Faz 2 admin)
    client_max_body_size 20M;

    # Gzip (sites seviyesinde; global nginx.conf'da da açık olmalı)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Next.js /_next/static uzun cache
    location /_next/static/ {
        proxy_pass http://selviler_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://selviler_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

